# En-têtes de sécurité, inclus dans chaque bloc qui sert du contenu.
#
# `always` est indispensable : sans lui, les en-têtes ne sont pas émis sur les
# réponses d'erreur. Et comme `add_header` ne s'hérite pas dans un bloc `location`
# qui définit ses propres en-têtes, ce fichier est inclus dans chacun d'eux.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Application 100 % statique : tout vient de l'origine, rien n'est appelé sur le
# réseau, et la page ne peut pas être encadrée. `wasm-unsafe-eval` couvre les
# chemins de décompression WebAssembly de SheetJS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
