worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log off;
    error_log  /dev/stderr warn;

    # Ne pas divulguer la version de nginx dans les réponses et les pages d'erreur.
    server_tokens off;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        font/ttf
        font/otf
        image/svg+xml;

    server {
        listen       8100;
        server_name  localhost;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Relais vers l'API du bot Discord.
        #
        # Le bot n'est pas publié sur Internet : son port n'est pas exposé par le
        # compose, et il n'est joignable que par le réseau interne. Le navigateur
        # parle donc à notre propre origine, ce qui évite CORS et permet de garder
        # `connect-src 'self'` dans la politique de sécurité de contenu.
        location = /api/adherents {
            # `proxy_pass` avec un nom d'hôte littéral résout le DNS une fois pour
            # toutes au démarrage : nginx refuserait de démarrer si le bot n'est pas
            # encore là, et continuerait de viser l'ancienne IP après un redémarrage
            # du conteneur. Passer par une variable force une résolution à chaque
            # requête, via le résolveur interne de Docker.
            resolver 127.0.0.11 ipv6=off valid=10s;
            set $bot_api http://bot:8080;
            proxy_pass $bot_api/adherents;

            # Aligné sur la limite du bot : un fichier trop gros est refusé ici,
            # sans traverser le réseau interne.
            client_max_body_size 8m;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Le reste de /api/ n'existe pas : on le ferme explicitement plutôt que de
        # le laisser retomber sur l'index Angular.
        location /api/ {
            return 404;
        }

        # Routage Angular
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
        }

        # L'index ne doit jamais être mis en cache : il référence les fichiers hachés.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Cache long terme sur les fichiers hachés par le build.
        # `expires` est laissé de côté : il émet son propre `Cache-Control` et on se
        # retrouverait avec deux en-têtes concurrents sur la même réponse.
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
