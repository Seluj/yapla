services:
  server:
    build:
      context: .
    ports:
      - 8100:8100
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 et non localhost : ce dernier résout aussi en ::1, sur lequel
      # nginx n'écoute pas, et la sonde échouerait.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8100/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
